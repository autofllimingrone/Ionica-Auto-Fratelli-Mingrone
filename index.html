<header class="main-header">
  <div class="main-header-inner">
    <div class="logo">
      <img src="logo.jpeg" alt="Ionica Auto Fratelli Mingrone" class="logo-img">
    </div>

    <div class="header-info">
      <div class="header-info-item header-info-clickable" id="addressLink" role="button" tabindex="0" aria-label="Apri la posizione su Google Maps">
        <span class="info-icon">&#128205;</span>
        <div>
          <strong>Corigliano Rossano 87064 (CS)</strong>
          <span>zona Villaggio Frassa</span><br>
          <span class="map-hint">Clicca per vedere la posizione</span>
        </div>
      </div>
      <div class="header-info-item">
        <span class="info-icon">&#128222;</span>
        <div class="phones-list">
          <div class="phone-row">
            <strong class="label-red">SIMONE:</strong>
            <span class="value-big"><a href="tel:+393317047561">+39 331 704 7561</a></span>
          </div>
          <div class="phone-row">
            <strong class="label-red">LUCIANO:</strong>
            <span class="value-big"><a href="tel:+393277867810">+39 327 786 7810</a></span>
          </div>
        </div>
      </div>
      <div class="header-info-item">
        <span class="info-icon">&#128231;</span>
        <div>
          <strong class="label-red">INFORMAZIONI:</strong> <span class="value-big"><a href="mailto:fllimingrone.auto@libero.it">fllimingrone.auto@libero.it</a></span>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- ===== HERO ===== -->
<section class="hero">
  <div class="hero-slider" id="heroSlider">
    <div class="hero-slide active" style="background-image:url('foto1.jpeg');"></div>
    <div class="hero-slide" style="background-image:url('foto2.jpeg');"></div>
    <div class="hero-slide" style="background-image:url('foto3.jpeg');"></div>
    <div class="hero-slide" style="background-image:url('foto4.jpeg');"></div>
    <div class="hero-slide" style="background-image:url('foto5.jpeg');"></div>
    <div class="hero-slide" style="background-image:url('foto6.jpeg');"></div>
  </div>
  <div class="hero-overlay"></div>
  <div class="hero-dots" id="heroDots">
    <button class="hero-dot active" data-slide="0" aria-label="Foto 1"></button>
    <button class="hero-dot" data-slide="1" aria-label="Foto 2"></button>
    <button class="hero-dot" data-slide="1" aria-label="Foto 3"></button>
    <button class="hero-dot" data-slide="1" aria-label="Foto 4"></button>
    <button class="hero-dot" data-slide="1" aria-label="Foto 5"></button>
    <button class="hero-dot" data-slide="1" aria-label="Foto 6"></button>
  </div>
</section>

<!-- ===== LISTING ===== -->
<main class="listing-wrap">

  <div class="listing-toolbar">
    <h2 class="toolbar-title">VEICOLI DISPONIBILI</h2>
    <div class="sort-control">
      <label for="sort">ORDINA PER:</label>
      <select id="sort">
        <option>Prezzo crescente</option>
        <option>Prezzo decrescente</option>
        <option>Km crescenti</option>
        <option>Km decrescenti</option>
        <option>Anno crescente</option>
        <option>Anno decrescente</option>
      </select>
    </div>
  </div>

  <!-- Il contenitore dei veicoli ora è VUOTO. Verrà popolato dinamicamente tramite script.js -->
  <ul class="vehicle-list" id="vehicleList"></ul>

  <!-- ===== PAGINAZIONE ===== -->
  <nav class="pagination" id="pagination" aria-label="Paginazione veicoli"></nav>

</main>

<!-- ===== FOOTER ===== -->
<footer class="site-footer">
  <p>&copy; 2026 Ionica Auto Fratelli Mingrone - Tutti i diritti riservati</p>
</footer>

<script src="script.js"></script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
</body>
